name: Deploy to GitHub Pages

on:
    push:
        branches: ["**"]
    schedule:
        - cron: "17 */6 * * *"
    workflow_dispatch:

permissions:
    contents: read

env:
    ASTRO_TELEMETRY_DISABLED: "1"

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            changed: ${{ steps.changes.outputs.changed }}
        permissions:
            contents: read
            actions: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  submodules: recursive

            - name: Check GitHub profile credential
              env:
                  WEBPAGE_GITHUB_PROFILE_READONLY: ${{ secrets.WEBPAGE_GITHUB_PROFILE_READONLY }}
              run: |
                  if [ -z "$WEBPAGE_GITHUB_PROFILE_READONLY" ]; then
                      echo "::error::Missing Actions secret WEBPAGE_GITHUB_PROFILE_READONLY."
                      exit 1
                  fi

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  package-manager-cache: false

            - name: Set up pnpm
              uses: pnpm/action-setup@v6
              with:
                  run_install: false

            - name: Install locked dependencies
              run: pnpm install --frozen-lockfile

            - name: Run tests
              run: pnpm test

            - name: Find last validated snapshots
              id: previous_snapshots
              uses: actions/github-script@v9
              with:
                  script: |
                      const { pathToFileURL } = await import("node:url");
                      const moduleUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/snapshots/artifact.mjs`);
                      const { selectSnapshots } = await import(moduleUrl.href);
                      await selectSnapshots({
                          github,
                          context,
                          core,
                      });

            - name: Restore last validated snapshots
              if: steps.previous_snapshots.outputs.artifact_id != ''
              uses: actions/download-artifact@v8
              with:
                  artifact-ids: ${{ steps.previous_snapshots.outputs.artifact_id }}
                  run-id: ${{ steps.previous_snapshots.outputs.run_id }}
                  github-token: ${{ github.token }}
                  path: ${{ steps.previous_snapshots.outputs.restore_directory }}

            - name: Refresh YouTube and MyMusic5 snapshots with artifact fallback
              env:
                  WEBPAGE_YOUTUBE_PROFILE_READONLY: ${{ secrets.WEBPAGE_YOUTUBE_PROFILE_READONLY }}
                  SNAPSHOT_RESTORE_DIR: ${{ steps.previous_snapshots.outputs.restore_directory }}
              run: pnpm refresh:media

            - name: Refresh GitHub data
              env:
                  WEBPAGE_GITHUB_PROFILE_READONLY: ${{ secrets.WEBPAGE_GITHUB_PROFILE_READONLY }}
                  GITHUB_PREVIOUS_SNAPSHOT_DIR: ${{ steps.previous_snapshots.outputs.restore_directory }}
              run: pnpm refresh:github

            - name: Find last successful deployment
              id: previous_deployment
              uses: actions/github-script@v9
              with:
                  script: |
                      const { pathToFileURL } = await import("node:url");
                      const moduleUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/deployment.mjs`);
                      const { selectDeployment } = await import(moduleUrl.href);
                      await selectDeployment({ github, context, core });

            - name: Restore deployment baseline
              if: steps.previous_deployment.outputs.artifact_id != ''
              uses: actions/download-artifact@v8
              with:
                  artifact-ids: ${{ steps.previous_deployment.outputs.artifact_id }}
                  run-id: ${{ steps.previous_deployment.outputs.run_id }}
                  github-token: ${{ github.token }}
                  path: ${{ steps.previous_deployment.outputs.restore_directory }}

            - name: Compare website inputs
              id: changes
              run: node scripts/deployment.mjs

            - name: Restore reusable content builds
              if: steps.changes.outputs.changed == 'true'
              uses: actions/cache@v5
              with:
                  path: .cache/content-build
                  key: content-build-${{ runner.os }}-${{ hashFiles('.node-version') }}-${{ github.sha }}
                  restore-keys: |
                      content-build-${{ runner.os }}-${{ hashFiles('.node-version') }}-

            - name: Build changed content and website
              if: steps.changes.outputs.changed == 'true'
              run: pnpm build --install

            - name: Check website
              if: steps.changes.outputs.changed == 'true'
              run: pnpm check

            - name: Save validated snapshots
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ steps.previous_snapshots.outputs.artifact_name }}
                  path: ${{ steps.previous_snapshots.outputs.snapshot_files }}
                  if-no-files-found: error
                  retention-days: 30

            - name: Upload website
              if: steps.changes.outputs.changed == 'true'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

            # This candidate is eligible as a baseline only after this run's deploy succeeds.
            - name: Save deployment candidate
              if: steps.changes.outputs.changed == 'true'
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ steps.previous_deployment.outputs.artifact_name }}
                  path: ${{ steps.previous_deployment.outputs.manifest_file }}
                  if-no-files-found: error
                  retention-days: 30

    deploy:
        needs: build
        if: needs.build.outputs.changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v5
